version: '3.8'

services:
  api:
    build: .
    container_name: api_auth
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=${NODE_ENV:-production}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - api_network

  # Serviço MongoDB (opcional - apenas para desenvolvimento local)
  # mongodb:
  #   image: mongo:7
  #   container_name: mongodb_local
  #   ports:
  #     - "27017:27017"
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
  #     MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - mongodb_data:/data/db
  #   networks:
  #     - api_network

networks:
  api_network:
    driver: bridge

